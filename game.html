<!doctype html>
<html lang="he"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מבוך זאב - navigation test</title>
<style>
 html,body{margin:0;height:100%;background:#1c1c1c;color:#eee;font:14px/1.4 sans-serif;overflow:hidden}
 #wrap{position:absolute;inset:0;display:flex;flex-direction:column}
 #bar{padding:6px 10px;background:#000a;z-index:2}
 #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
 canvas{max-width:100%;max-height:100%;background:#fff}
 kbd{background:#444;border-radius:3px;padding:0 5px}
</style></head><body><div id="wrap">
<div id="bar"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> move &nbsp; <kbd>D</kbd> debug (green = reachable from start, red = walkable but cut off) &nbsp; <kbd>W</kbd> walls &nbsp; <kbd>R</kbd> restart &nbsp; <span id="info"></span></div>
<div id="stage"><canvas id="c"></canvas></div></div>
<script>
const W=1710,H=1378;
const START=[270,100], SPEED=170, HR=7;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const info=document.getElementById('info');
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}
(async()=>{
 const [bg,dbg,maskImg,ann]=await Promise.all([load('maze_clean.jpg'),load('maze_reach.jpg'),load('walkmask.png'),fetch('annotations.json').then(r=>r.json())]);
 const oc=document.createElement('canvas');oc.width=W;oc.height=H;const octx=oc.getContext('2d');octx.drawImage(maskImg,0,0);
 const md=octx.getImageData(0,0,W,H).data;
 const ok=(x,y)=>{x=Math.round(x);y=Math.round(y);return x>=0&&y>=0&&x<W&&y<H&&md[(y*W+x)*4]>128;};
 const T={};ann.trampolines.forEach(t=>T[t.id]=t);
 const links=ann.trampoline_links;
 let hx,hy,cool=null,debug=false,walls=false,jumps=0;
 const reset=()=>{hx=START[0];hy=START[1];cool=null;};reset();
 const keys={};
 addEventListener('keydown',e=>{
  if(e.key.startsWith('Arrow')){keys[e.key]=true;e.preventDefault();}
  else if(e.key==='d'||e.key==='D')debug=!debug;
  else if(e.key==='w'||e.key==='W')walls=!walls;
  else if(e.key==='r'||e.key==='R')reset();
 });
 addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))keys[e.key]=false;});
 let last=performance.now();
 function step(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  if(dx&&dy){dx*=Math.SQRT1_2;dy*=Math.SQRT1_2;}
  // move in small sub-steps so thin walls are never skipped
  const dist=SPEED*dt,n=Math.max(1,Math.ceil(dist/1.5));
  for(let i=0;i<n;i++){
   const sx=dx*dist/n,sy=dy*dist/n;
   if(ok(hx+sx,hy))hx+=sx;
   if(ok(hx,hy+sy))hy+=sy;
  }
  // trampolines: step on one to jump along its arrow
  if(cool){const t=T[cool];if(Math.hypot(hx-t.center[0],hy-t.center[1])>t.radius+4)cool=null;}
  if(!cool)for(const l of links){const a=T[l.from];
   if(Math.hypot(hx-a.center[0],hy-a.center[1])<a.radius-6){const b=T[l.to];hx=b.center[0];hy=b.center[1];cool=l.to;jumps++;break;}}
  draw();requestAnimationFrame(step);
 }
 function draw(){
  ctx.drawImage(debug?dbg:bg,0,0,W,H);
  if(walls){ctx.strokeStyle='#1d4fd8';ctx.lineWidth=2;ctx.beginPath();
   for(const l of ann.walls){ctx.moveTo(l[0][0],l[0][1]);for(let i=1;i<l.length;i++)ctx.lineTo(l[i][0],l[i][1]);}ctx.stroke();}
  // hero: round icon
  ctx.save();ctx.translate(hx,hy);
  ctx.fillStyle='#ffd23f';ctx.strokeStyle='#222';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.arc(0,0,HR+1,0,6.2832);ctx.fill();ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-2.6,-1.5,1.3,0,6.2832);ctx.arc(2.6,-1.5,1.3,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.arc(0,1.5,3,0.15*Math.PI,0.85*Math.PI);ctx.lineWidth=1.3;ctx.stroke();
  ctx.restore();
  info.textContent=`x=${hx|0} y=${hy|0}  trampoline jumps: ${jumps}`;
 }
 requestAnimationFrame(step);
})();
</script></body></html>
